name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            export PATH=/usr/local/bin:/usr/bin:/usr/sbin:$PATH
            cd /opt/openbuild

            # Pull latest
            git pull origin main

            # Build API
            cd apps/api
            npm ci --production=false
            npx tsc

            # Build frontend
            cd ../web
            npm ci --production=false
            npm run build

            # Restart via systemd
            sudo systemctl restart openbuild-api
            sleep 3
            curl -sf http://localhost:41935/health
