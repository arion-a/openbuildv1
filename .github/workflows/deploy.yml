name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            export PATH=/usr/local/bin:/usr/bin:/usr/sbin:$PATH
            cd /opt/openbuild

            # Stop API before updating
            sudo systemctl stop openbuild-api

            # Pull latest
            git pull origin main

            # Install all workspace deps from root
            npm ci

            # Build API
            cd apps/api
            npx tsc

            # Build frontend
            cd ../web
            npm run build

            # Start API
            cd /opt/openbuild
            sudo systemctl start openbuild-api

            # Wait for healthy
            for i in 1 2 3 4 5; do
              sleep 2
              if curl -sf http://localhost:41935/health > /dev/null 2>&1; then
                echo "Deploy successful — API healthy"
                exit 0
              fi
            done
            echo "API failed to start" && exit 1
